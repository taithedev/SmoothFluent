name: SmoothFluent Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          mkdir -p dist
          cp -r src example docs README.md LICENSE CHANGELOG.md default.project.json selene.toml dist/
          cd dist
          zip -r ../SmoothFluent-release.zip .
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: SmoothFluent-release.zip
